name: Build zip on push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build trackside-commit-<sha7>.zip
        shell: bash
        run: |
          VER="commit-${GITHUB_SHA::7}"
          python bin/package/build_package.py --artifact-version "$VER" --output-dir dist
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Validate the package manifest
        run: python bin/package/validate_manifest.py "dist/trackside-${{ env.VER }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trackside-${{ env.VER }}
          path: dist/trackside-${{ env.VER }}.zip
          if-no-files-found: error
