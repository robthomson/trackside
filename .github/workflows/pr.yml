name: Build zip on pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build trackside-pr<n>-<sha7>.zip
        shell: bash
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          VER="pr${{ github.event.pull_request.number }}-${SHA::7}"
          python bin/package/build_package.py --artifact-version "$VER" --output-dir dist
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Validate the package manifest
        run: python bin/package/validate_manifest.py "dist/trackside-${{ env.VER }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trackside-${{ env.VER }}
          path: dist/trackside-${{ env.VER }}.zip
          if-no-files-found: error
