name: Release

# Push a tag release/<version> (e.g. release/0.1.0, or release/0.2.0-rc1 for a
# release candidate) to publish a GitHub release with the package zip and the
# setup guide. Notes come from "# <version>" in Releases.md.

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#release/}"
          if [[ $VER =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+$ ]]; then
            echo "KIND=Release Candidate" >> "$GITHUB_ENV"
            echo "PRE=--prerelease" >> "$GITHUB_ENV"
          else
            echo "KIND=Release" >> "$GITHUB_ENV"
            echo "PRE=" >> "$GITHUB_ENV"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Release notes
        run: python .github/scripts/extract_release_notes.py "${{ env.VER }}" Releases.md > Notes.md

      - name: Build and validate the package
        run: |
          python bin/package/build_package.py --artifact-version "${{ env.VER }}" --release-notes-file Notes.md --output-dir dist
          python bin/package/validate_manifest.py "dist/trackside-${{ env.VER }}.zip"
          cp docs/Trackside-Setup-Guide.pdf dist/

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" $PRE --notes-file Notes.md \
            -t "Trackside - ${{ env.KIND }} ${{ env.VER }}" dist/*
